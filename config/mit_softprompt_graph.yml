config_name: 'mit_softprompt_graph'

DATASET:
  dset_name:      'mit'
  dset_split:     '1'
  name:           'mitstates'
  root_dir:       '/home/bingxing2/home/scx6d4e/run/xuanzhenzhen/Base/data/mit-states'
  splitname:      'compositional-split-natural'
  split_files_loc: 'Data_files/MIT'

DISTRIBUTED:
  world_size: 1

MODEL:
  name: 'clip_softprompt_graph'

  # ── 软提示 ──────────────────────────────────────
  n_ctx:          4        # 静态软提示长度（父类）

  # ── 图模块 ──────────────────────────────────────
  graph_dim:      512      # RGCN hidden dim
  graph_layers:   2        # <--- 新增: RGCN 层数
  graph_bases:    4        # RGCN 基函数数量
  graph_dropout:  0.3
  n_meta_ctx:     4        # MetaNet 生成的动态 token 数

  # ── LLM 邻域开关 ─────────────────────────────────
  use_llm_nel:    False
  llm_nel_dir:    '/home/bingxing2/home/scx6d4e/run/xuanzhenzhen/ov-czsl/llm_nel_gen/mit-states_neighbors'
  max_neighbors:  5

  # ── 损失权重 ──────────────────────────────────────
  w_loss_attr:    0.3
  w_loss_obj:     0.3
  w_loss_neigh:   0.1      # 邻域平滑损失权重（0.0 = 关闭）

  # ── NEL 开关（关闭原 GloVe NEL）──────────────────
  use_nel_data:           False
  use_extra_pair_loss:    False
  use_extra_attr_loss:    False
  use_extra_obj_loss:     False
  use_composed_pair_loss: False
  use_emb_pair_loss:      False
  use_attr_loss:          False
  use_obj_loss:           False

  # ── dataset.py 兼容字段 ──────────────────────────
  use_fg_estimator: False
  img_emb_dim:      2048
  img_emb_drop:     0.0
  img_emb_method:   'conv_interm'
  img_final_bias:   True
  img_drop_last:    0.0
  drop_input:       0.0
  smoothing:        0.0
  load_checkpoint:  False
  weights:          ''
  optim_weights:    ''

TRAIN:
  batch_size:             128
  checkpoint_dir:         'checkpoints'
  clip_type:              'ViT-L/14'
  decay_factor:           0.1
  decay_patience:         3
  decay_strategy:         'milestone'
  disp_interval:          50
  eval_every_epoch:       1
  final_max_epoch:        20
  finetune_backbone:      False
  log_dir:                'tensorboards'
  lr:                     1e-3
  lr_decay_milestones:    [12, 17]
  lr_encoder:             0.0
  lr_word_embedding:      0.0
  max_epoch:              20
  n_sample_hard_negative: 0
  num_workers:            4
  sample_hard_negative:   False
  sample_negative_pairs:  -1
  sample_similar_object:  False
  save_every_epoch:       1
  seed:                   124
  start_epoch:            1
  start_epoch_validate:   0
  test_batch_size:        512
  use_precomputed_features: False
  wd:                     1e-4
  wd_encoder:             0.0
  comb_features:          False

EVAL:
  topk: 1